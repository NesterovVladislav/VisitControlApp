<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: приложение рисует под вырезом экрана, отступы даёт SafeAreaView -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA: установка на экран «Домой» (docs/pwa-ios.md) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Safari берёт иконку и вид статус-бара не из манифеста, а из этих тегов -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ДоброВход" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Номера телефонов — обычный текст, ссылки делает само приложение -->
    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Без «резинки» и обновления страницы жестом: списки обновляет кнопка «Обновить» */
        overscroll-behavior: none;
        background-color: #f5f5f5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #000;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Для работы ДоброВхода включите JavaScript.
    </noscript>
    <div id="root"></div>
    <script>
      // Service worker кэширует оболочку приложения: оно открывается без задержки и показывает
      // понятный экран без сети. Данные API не кэшируются (public/sw.js).
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
